
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_media_sales'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_clickhouse_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Nombre de mois (en plus du mois en cours) rechargés en entier à chaque run incrémental
  # insert_overwrite, pour couvrir les corrections tardives dans une partition déjà chargée.
  dg_incremental_lookback_months: 1
  # Taux de change fixe USD -> CAD utilisé par game_sales_monthly_revenue (self-service). Pas de
  # table de taux historique par période pour l'instant -- à remplacer par une vraie source de
  # taux si la précision historique devient nécessaire.
  dg_usd_to_cad_rate: 1.35

# Configuring models
models:
  dbt_media_sales:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: view
      DB_WH_Digital_gaming:
        +schema: DB_WH_DIGITAL_GAMING
      DB_WH_Digital_music:
        +schema: DB_WH_DIGITAL_MUSIC
    intermediate:
      +materialized: view
      DB_WH_Digital_gaming:
        +schema: DB_WH_DIGITAL_GAMING
    marts:
      +materialized: table
      DB_WH_Digital_gaming:
        self_service:
          # Couche self-service : vues fines sur les FTC_*/DIM_* déjà matérialisées en table dans
          # core/ (jointures/renommages peu coûteux sur ClickHouse) -> toujours à jour, pas de
          # duplication de stockage. Passer un modèle en +materialized: table au cas par cas s'il
          # fait une vraie agrégation (GROUP BY) consommée par beaucoup d'utilisateurs concurrents.
          +materialized: view
          +schema: DB_WH_DIGITAL_GAMING_SELF_SERVICE
