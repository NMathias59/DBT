version: 2

models:
  - name: DIM_GAMES
    description: >
      Dimension jeu (catalogue). Grain : une ligne par jeu. Type 1 (pas d'historisation), full
      rebuild à chaque run vu le faible volume. Éditeur/développeur résolus en clair, genres et
      tags agrégés en tableaux, config système jointe.
    columns:
      - name: game_id
        description: Identifiant unique du jeu.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Titre du jeu.
        data_tests:
          - not_null
      - name: price
        description: Prix catalogue du jeu.
        data_tests:
          - not_null
      - name: release_date
        description: Date de sortie du jeu.
        data_tests:
          - not_null
      - name: publisher_id
        description: Éditeur du jeu.
        data_tests:
          - not_null
      - name: publisher_name
        description: Nom de l'éditeur.
        data_tests:
          - not_null
      - name: developer_id
        description: Développeur du jeu.
        data_tests:
          - not_null
      - name: developer_name
        description: Nom du développeur.
        data_tests:
          - not_null
      - name: genre_ids
        description: Identifiants des genres associés au jeu.
      - name: genre_names
        description: Noms des genres associés au jeu.
      - name: tag_ids
        description: Identifiants des tags associés au jeu.
      - name: tag_names
        description: Noms des tags associés au jeu.
      - name: operating_system
        description: Système d'exploitation requis.
      - name: processor
        description: Processeur requis.
      - name: memory
        description: Mémoire vive requise.
      - name: graphics
        description: Carte graphique requise.
      - name: storage
        description: Espace de stockage requis.

  - name: DIM_DATE
    description: >
      Dimension calendaire générique (réutilisable par tout domaine, pas seulement Digital Gaming).
      Grain : une ligne par jour, 2020-01-01 à 2030-12-31.
    columns:
      - name: date_day
        description: Date (grain jour).
        data_tests:
          - not_null
          - unique
      - name: date_id
        description: Clé numérique YYYYMMDD (utile pour partitionnement/tri).
        data_tests:
          - not_null
          - unique
      - name: year
        description: Année.
        data_tests:
          - not_null
      - name: quarter
        description: Trimestre (1-4).
        data_tests:
          - not_null
      - name: month
        description: Mois (1-12).
        data_tests:
          - not_null
      - name: month_name
        description: Nom du mois (en anglais).
        data_tests:
          - not_null
      - name: day_of_month
        description: Jour du mois (1-31).
        data_tests:
          - not_null
      - name: day_of_week
        description: Jour de la semaine (1=lundi ... 7=dimanche).
        data_tests:
          - not_null
      - name: day_name
        description: Nom du jour de la semaine (en anglais).
        data_tests:
          - not_null
      - name: iso_week
        description: Numéro de semaine ISO.
        data_tests:
          - not_null
      - name: is_weekend
        description: Indique si le jour est un samedi ou un dimanche.
        data_tests:
          - not_null
      - name: year_month
        description: Clé numérique YYYYMM, pratique pour des rollups mensuels.
        data_tests:
          - not_null

  - name: DIM_DLCS
    description: >
      Dimension DLC, avec le jeu parent résolu en clair. Complète DIM_GAMES pour analyser les
      ventes de DLC de FTC_SALES (product_type = 'dlc').
    columns:
      - name: dlc_id
        description: Identifiant unique du DLC.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: Jeu auquel le DLC est rattaché.
        data_tests:
          - not_null
      - name: game_title
        description: Titre du jeu parent.
        data_tests:
          - not_null
      - name: dlc_title
        description: Titre du DLC.
        data_tests:
          - not_null
      - name: price
        description: Prix catalogue du DLC.
        data_tests:
          - not_null
      - name: release_date
        description: Date de sortie du DLC.
        data_tests:
          - not_null

  - name: DIM_ITEMS
    description: >
      Dimension objet in-game (catalogue complet, vendu ou non sur le marché secondaire). Grain :
      une ligne par objet, avec le jeu parent résolu en clair.
    columns:
      - name: item_id
        description: Identifiant unique de l'objet.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: Jeu auquel l'objet appartient.
        data_tests:
          - not_null
      - name: game_title
        description: Titre du jeu parent.
        data_tests:
          - not_null
      - name: item_name
        description: Nom de l'objet.
        data_tests:
          - not_null
      - name: item_type
        description: Type de l'objet.
        data_tests:
          - not_null
      - name: item_rarity
        description: Rareté de l'objet.
        data_tests:
          - not_null

  - name: DIM_ACHIEVEMENTS
    description: >
      Dimension succès (catalogue statique). Grain : une ligne par succès. Complète
      FTC_USER_ACHIEVEMENTS.
    columns:
      - name: achievement_id
        description: Identifiant unique du succès.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: Jeu auquel le succès est rattaché.
        data_tests:
          - not_null
      - name: game_title
        description: Titre du jeu parent.
        data_tests:
          - not_null
      - name: achievement_name
        description: Nom du succès.
        data_tests:
          - not_null
      - name: points
        description: Points attribués pour ce succès.
        data_tests:
          - not_null

  - name: DIM_SUBSCRIPTION_PLANS
    description: >
      Dimension formule d'abonnement (catalogue complet, y compris formules inactives). Grain :
      une ligne par formule. Complète FTC_SUBSCRIPTIONS.
    columns:
      - name: plan_id
        description: Identifiant unique de la formule.
        data_tests:
          - not_null
          - unique
      - name: plan_name
        description: Nom de la formule.
        data_tests:
          - not_null
      - name: price
        description: Prix de la formule.
        data_tests:
          - not_null
      - name: billing_period_days
        description: Durée du cycle de facturation, en jours.
        data_tests:
          - not_null
      - name: is_active
        description: Indique si la formule est actuellement proposée à la vente.
        data_tests:
          - not_null

  - name: DIM_PAYMENT_METHODS
    description: >
      Dimension moyen de paiement. Grain : une ligne par moyen de paiement (un utilisateur peut en
      avoir plusieurs). account_number volontairement exclu (PII, pas de valeur analytique).
    columns:
      - name: payment_method_id
        description: Identifiant unique du moyen de paiement.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur propriétaire du moyen de paiement.
        data_tests:
          - not_null
      - name: provider
        description: Fournisseur du moyen de paiement.
        data_tests:
          - not_null
      - name: expiry_date
        description: Date d'expiration du moyen de paiement.
        data_tests:
          - not_null

  - name: DIM_USERS
    description: >
      Dimension utilisateur, avec agrégats d'activité (logins, bibliothèque, succès débloqués).
      Grain : une ligne par utilisateur. Full rebuild à chaque run, volume faible.
    columns:
      - name: user_id
        description: Identifiant unique de l'utilisateur.
        data_tests:
          - not_null
          - unique
      - name: username
        description: Nom d'utilisateur.
        data_tests:
          - not_null
      - name: total_logins
        description: Nombre total de connexions.
        data_tests:
          - not_null
      - name: suspicious_logins
        description: Nombre de connexions jugées suspectes.
        data_tests:
          - not_null
      - name: last_login_at
        description: Date/heure de la dernière connexion.
      - name: games_owned
        description: Nombre de jeux possédés (bibliothèque).
        data_tests:
          - not_null
      - name: total_playtime_minutes
        description: Temps de jeu cumulé, en minutes.
        data_tests:
          - not_null
      - name: achievements_unlocked
        description: Nombre de succès débloqués.
        data_tests:
          - not_null

  - name: FTC_REVIEWS
    description: >
      Table de faits des avis postés sur les jeux. Grain : une ligne = un avis. Full rebuild à
      chaque run (pas d'incrémental) car les compteurs de votes évoluent après la création de
      l'avis -- voir commentaire dans le modèle.
    columns:
      - name: review_id
        description: Identifiant unique de l'avis.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur ayant rédigé l'avis.
        data_tests:
          - not_null
      - name: game_id
        description: Jeu concerné par l'avis.
        data_tests:
          - not_null
      - name: is_recommended
        description: Indique si l'utilisateur recommande le jeu.
        data_tests:
          - not_null
      - name: total_votes
        description: Nombre total de votes reçus sur l'avis.
        data_tests:
          - not_null
      - name: helpful_votes
        description: Nombre de votes jugeant l'avis utile.
        data_tests:
          - not_null
      - name: helpful_ratio
        description: Part de votes utiles parmi les votes reçus (NULL si aucun vote).
      - name: created_at
        description: Date/heure de création de l'avis.
        data_tests:
          - not_null
      - name: nearest_prior_dlc_id
        description: >
          DLC du jeu sorti le plus récemment avant cet avis (NULL si aucun DLC sorti avant).
          Sert à contextualiser une chute de sentiment liée à une sortie de contenu.
      - name: days_since_last_dlc_release
        description: >
          Nombre de jours écoulés entre la sortie du DLC le plus proche (nearest_prior_dlc_id) et
          la création de l'avis. NULL si aucun DLC sorti avant. Filtrer sur une petite fenêtre
          (ex: 0-7 jours) pour repérer une vague d'avis liée à une sortie.

  - name: FTC_NEWS_ARTICLES
    description: >
      Table de faits (factless) des articles publiés sur les jeux. Grain : une ligne = un article.
      Sert à corréler dans le temps avec FTC_REVIEWS/FTC_SALES (ex: réaction des joueurs après une
      publication).
    columns:
      - name: article_id
        description: Identifiant unique de l'article.
        data_tests:
          - not_null
          - unique
      - name: game_id
        description: Jeu concerné par l'article.
        data_tests:
          - not_null
      - name: title
        description: Titre de l'article.
        data_tests:
          - not_null
      - name: published_at
        description: Date/heure de publication de l'article.
        data_tests:
          - not_null

  - name: FTC_MARKET_LISTINGS
    description: >
      Table de faits des annonces mises en vente sur le marché secondaire. Grain : une ligne =
      une annonce. Distinct de FTC_MARKET_TRANSACTIONS (grain = transaction) : une annonce peut ne
      jamais se vendre, ou être liée à plusieurs transactions dans ce jeu de données. Full rebuild
      (pas d'incrémental), le statut est mutable après listed_at.
      ATTENTION qualité de données : le flag is_sold de la source n'est fiable que dans 49% des cas
      (constaté sur les 810 annonces réelles) -- utiliser is_actually_sold pour toute analyse.
    columns:
      - name: listing_id
        description: Identifiant unique de l'annonce.
        data_tests:
          - not_null
          - unique
      - name: seller_id
        description: Utilisateur vendeur.
        data_tests:
          - not_null
      - name: item_id
        description: Objet mis en vente.
        data_tests:
          - not_null
      - name: item_name
        description: Nom de l'objet mis en vente.
        data_tests:
          - not_null
      - name: item_type
        description: Type de l'objet mis en vente.
        data_tests:
          - not_null
      - name: item_rarity
        description: Rareté de l'objet mis en vente.
        data_tests:
          - not_null
      - name: listed_price
        description: Prix affiché sur l'annonce.
        data_tests:
          - not_null
      - name: listed_at
        description: Date/heure de mise en vente.
        data_tests:
          - not_null
      - name: is_actually_sold
        description: >
          Statut "vendu" fiable, dérivé de l'existence réelle d'une transaction
          (transaction_count > 0). À utiliser pour toute analyse, PAS is_sold_source_flag.
        data_tests:
          - not_null
      - name: transaction_count
        description: Nombre réel de transactions liées à cette annonce (0 si aucune).
        data_tests:
          - not_null
      - name: is_sold_source_flag
        description: >
          Statut "vendu" tel que déclaré par la source (flag brut, non fiable -- cf.
          is_sold_flag_consistent). Conservé pour traçabilité, pas pour l'analyse.
        data_tests:
          - not_null
      - name: is_sold_flag_consistent
        description: >
          Indique si is_sold_source_flag est cohérent avec is_actually_sold. false = incohérence
          constatée dans les données source (51% des annonces).
        data_tests:
          - not_null

  - name: FTC_LIBRARY
    description: >
      Table de faits des jeux en bibliothèque des utilisateurs. Grain : une ligne par jeu possédé.
      Distinct de FTC_SALES (pas forcément passé par un achat). Full rebuild (pas d'incrémental)
      car playtime_minutes augmente en continu après purchase_date.
    columns:
      - name: library_id
        description: Identifiant unique de l'entrée de bibliothèque.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur propriétaire du jeu.
        data_tests:
          - not_null
      - name: game_id
        description: Jeu possédé.
        data_tests:
          - not_null
      - name: purchase_date
        description: Date/heure d'acquisition du jeu.
        data_tests:
          - not_null
      - name: playtime_minutes
        description: Temps de jeu cumulé, en minutes.
        data_tests:
          - not_null

  - name: FTC_WISHLISTS
    description: >
      Table de faits des ajouts en liste de souhaits. Grain : une ligne par ajout (un couple
      user/game peut apparaître plusieurs fois -- pas de déduplication). Signal de demande, utile
      pour un funnel wishlist -> achat en rapprochant de FTC_SALES.
    columns:
      - name: wishlist_id
        description: Clé de substitution (hash de user_id/game_id/added_at, pas de clé source).
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur propriétaire de la liste de souhaits.
        data_tests:
          - not_null
      - name: game_id
        description: Jeu ajouté à la liste de souhaits.
        data_tests:
          - not_null
      - name: added_at
        description: Date/heure d'ajout à la liste de souhaits.
        data_tests:
          - not_null

  - name: FTC_USER_ACHIEVEMENTS
    description: >
      Table de faits des déblocages de succès. Grain : une ligne par déblocage (un couple
      user/achievement peut apparaître plusieurs fois -- pas de déduplication).
    columns:
      - name: user_achievement_id
        description: Clé de substitution (hash de user_id/achievement_id/unlocked_at).
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur ayant débloqué le succès.
        data_tests:
          - not_null
      - name: achievement_id
        description: Succès débloqué.
        data_tests:
          - not_null
      - name: unlocked_at
        description: Date/heure de déblocage du succès.
        data_tests:
          - not_null

  - name: FTC_LOGIN_EVENTS
    description: >
      Table de faits des événements de connexion. Grain : une ligne par événement. Incrémental
      insert_overwrite (comme FTC_SALES) : événement immuable une fois créé, volume qui grossit
      en continu.
    columns:
      - name: login_event_id
        description: Identifiant unique de l'événement de connexion.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur concerné.
        data_tests:
          - not_null
      - name: event_time
        description: Date/heure de l'événement.
        data_tests:
          - not_null
      - name: event_date
        description: Date de l'événement (jour), utilisée comme clé de partitionnement mensuel.
        data_tests:
          - not_null
      - name: ip_address
        description: Adresse IP de connexion.
        data_tests:
          - not_null
      - name: device
        description: Appareil utilisé pour la connexion.
        data_tests:
          - not_null
      - name: event_type
        description: Type d'événement (connexion, déconnexion...).
        data_tests:
          - not_null
      - name: is_suspicious
        description: Indique si l'événement est jugé suspect.
        data_tests:
          - not_null

  - name: FTC_FRAUD_FLAGS
    description: >
      Table de faits des signalements de fraude. Grain : une ligne = un signalement. Full rebuild
      à chaque run (pas d'incrémental) car status évolue après flagged_at au fil de l'investigation.
    columns:
      - name: fraud_flag_id
        description: Identifiant unique du signalement.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur signalé.
        data_tests:
          - not_null
      - name: flagged_at
        description: Date/heure du signalement.
        data_tests:
          - not_null
      - name: flag_type
        description: Type de fraude signalée.
        data_tests:
          - not_null
      - name: status
        description: Statut courant du signalement (investigation).
        data_tests:
          - not_null
      - name: related_market_transaction_id
        description: Transaction du marché liée au signalement, le cas échéant (NULL sinon).
      - name: related_transaction_amount
        description: Montant de la transaction liée, le cas échéant (NULL si aucune transaction liée).
      - name: related_item_name
        description: Objet de la transaction liée, le cas échéant (NULL si aucune transaction liée).

  - name: FTC_SUBSCRIPTIONS
    description: >
      Table de faits des abonnements souscrits. Grain : une ligne = un abonnement. Full rebuild à
      chaque run (pas d'incrémental) car status/end_date/auto_renew évoluent après start_date --
      voir commentaire dans le modèle.
    columns:
      - name: subscription_id
        description: Identifiant unique de l'abonnement.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Utilisateur abonné.
        data_tests:
          - not_null
      - name: plan_id
        description: Formule d'abonnement souscrite.
        data_tests:
          - not_null
      - name: plan_name
        description: Nom de la formule.
        data_tests:
          - not_null
      - name: plan_price
        description: Prix de la formule (mesure -- contribution MRR/ARR potentielle).
        data_tests:
          - not_null
      - name: billing_period_days
        description: Durée du cycle de facturation, en jours.
        data_tests:
          - not_null
      - name: start_date
        description: Date de début de l'abonnement.
        data_tests:
          - not_null
      - name: end_date
        description: Date de fin de l'abonnement, le cas échéant (NULL si toujours actif).
      - name: status
        description: Statut courant de l'abonnement.
        data_tests:
          - not_null
      - name: auto_renew
        description: Indique si l'abonnement se renouvelle automatiquement.
        data_tests:
          - not_null

  - name: FTC_SALES
    description: >
      Table de faits des ventes primaires (achats de jeux/DLC). Grain : une ligne = un article
      acheté (purchase_item). Incrémental insert_overwrite, partitionné par mois
      (toYYYYMM(sale_date)) ; chaque run recharge entièrement les N derniers mois
      (var dg_incremental_lookback_months) pour capter les corrections tardives.
    columns:
      - name: sale_id
        description: Identifiant unique de la vente (= purchase_item_id).
        data_tests:
          - not_null
          - unique
      - name: purchase_id
        description: Commande à laquelle la vente est rattachée (un achat peut contenir plusieurs ventes).
        data_tests:
          - not_null
      - name: user_id
        description: Utilisateur acheteur.
        data_tests:
          - not_null
      - name: payment_method_id
        description: Moyen de paiement utilisé pour l'achat.
        data_tests:
          - not_null
      - name: payment_provider
        description: Fournisseur du moyen de paiement.
        data_tests:
          - not_null
      - name: product_type
        description: Type de produit vendu (game ou dlc).
        data_tests:
          - not_null
      - name: game_id
        description: Jeu acheté, si product_type = game.
      - name: dlc_id
        description: DLC acheté, si product_type = dlc.
      - name: product_title
        description: Titre du produit vendu (jeu ou DLC).
        data_tests:
          - not_null
      - name: sale_amount
        description: Montant de la vente.
        data_tests:
          - not_null
      - name: sale_at
        description: Date/heure de la vente.
        data_tests:
          - not_null
      - name: sale_date
        description: Date de la vente (jour), utilisée comme clé de partitionnement mensuel.
        data_tests:
          - not_null

  - name: FTC_MARKET_TRANSACTIONS
    description: >
      Table de faits du marché secondaire (échanges C2C d'objets in-game). Grain : une ligne = une
      transaction sur une annonce. Incrémental insert_overwrite, partitionné par mois
      (toYYYYMM(sale_date)) ; mêmes règles de rechargement que FTC_SALES.
    columns:
      - name: market_transaction_id
        description: Identifiant unique de la transaction.
        data_tests:
          - not_null
          - unique
      - name: listing_id
        description: Annonce vendue.
        data_tests:
          - not_null
      - name: seller_id
        description: Utilisateur vendeur.
        data_tests:
          - not_null
      - name: buyer_id
        description: Utilisateur acheteur.
        data_tests:
          - not_null
      - name: item_id
        description: Objet échangé.
        data_tests:
          - not_null
      - name: item_name
        description: Nom de l'objet échangé.
        data_tests:
          - not_null
      - name: item_type
        description: Type de l'objet échangé.
        data_tests:
          - not_null
      - name: item_rarity
        description: Rareté de l'objet échangé.
        data_tests:
          - not_null
      - name: listed_price
        description: Prix affiché sur l'annonce.
        data_tests:
          - not_null
      - name: final_price
        description: Prix final de la transaction.
        data_tests:
          - not_null
      - name: price_variance
        description: Écart entre le prix final et le prix affiché (final_price - listed_price).
        data_tests:
          - not_null
      - name: listed_at
        description: Date/heure de mise en vente.
        data_tests:
          - not_null
      - name: sold_at
        description: Date/heure de la vente.
        data_tests:
          - not_null
      - name: sale_date
        description: Date de la vente (jour), utilisée comme clé de partitionnement mensuel.
        data_tests:
          - not_null
