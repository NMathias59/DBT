version: 2

models:
  - name: stg_imdb_movie
    description: Staging des films (movies) du domaine IMDB.
    columns:
      - name: movie_id
        description: Identifiant unique du film.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Titre du film.
        data_tests:
          - not_null
      - name: year
        description: Année de sortie, le cas échéant.
      - name: rating
        description: Note moyenne du film, le cas échéant.
      - name: nvotes
        description: Nombre de votes ayant contribué à la note, le cas échéant.

  - name: stg_imdb_person
    description: Staging des personnes (people, cast/crew) du domaine IMDB.
    columns:
      - name: person_id
        description: Identifiant unique de la personne.
        data_tests:
          - not_null
          - unique
      - name: name
        description: Nom de la personne.
        data_tests:
          - not_null
      - name: gender
        description: Genre de la personne (100% NULL sur ce jeu de données, non renseigné en source).

  - name: stg_imdb_credit
    description: Staging des crédits (credits, jonction film/personne/rôle) du domaine IMDB.
    columns:
      - name: person_id
        description: Personne créditée.
        data_tests:
          - not_null
      - name: movie_id
        description: Film concerné.
        data_tests:
          - not_null
      - name: type
        description: Type de crédit (actor, director, writer, producer, composer, ...).
        data_tests:
          - not_null
      - name: note
        description: Note libre sur le crédit, le cas échéant.
      - name: character
        description: Personnage interprété, pour un crédit de type "actor".
      - name: position
        description: Ordre de crédit (100% NULL sur ce jeu de données).
      - name: line_order
        description: Ordre de ligne (100% NULL sur ce jeu de données).
      - name: group_order
        description: Ordre de groupe (100% NULL sur ce jeu de données).
      - name: subgroup_order
        description: Ordre de sous-groupe (100% NULL sur ce jeu de données).

  - name: stg_imdb_genre
    description: Staging de l'association films/genres (genres) du domaine IMDB.
    columns:
      - name: movie_id
        description: Film associé.
        data_tests:
          - not_null
      - name: genre
        description: Genre associé.
        data_tests:
          - not_null

  - name: stg_imdb_language
    description: Staging des langues (languages) du domaine IMDB.
    columns:
      - name: movie_id
        description: Film associé.
        data_tests:
          - not_null
      - name: language
        description: Code de langue.
        data_tests:
          - not_null
      - name: note
        description: >
          Malgré son nom, contient le titre du film dans cette langue quand renseigné (pas une
          note libre) -- voir imdb_overview.

  - name: stg_imdb_running_time
    description: Staging des durées (running_times) du domaine IMDB.
    columns:
      - name: movie_id
        description: Film associé.
        data_tests:
          - not_null
          - unique
      - name: running_time_minutes
        description: Durée du film, en minutes.
        data_tests:
          - not_null
      - name: note
        description: Note libre sur la durée, le cas échéant.

  - name: stg_imdb_certificate
    description: >
      Staging des classifications (certificates) du domaine IMDB. Table source vide (0 ligne) sur
      ce jeu de données -- voir imdb_overview.
    columns:
      - name: movie_id
        description: Film associé.
      - name: country
        description: Pays de la classification.
      - name: certificate
        description: Classification attribuée.
      - name: note
        description: Note libre, le cas échéant.

  - name: stg_imdb_color_info
    description: >
      Staging des informations couleur (color_info) du domaine IMDB. Table source vide (0 ligne)
      sur ce jeu de données -- voir imdb_overview.
    columns:
      - name: movie_id
        description: Film associé.
      - name: value
        description: "Information couleur (ex : Color, Black and White)."
      - name: note
        description: Note libre, le cas échéant.

  - name: stg_imdb_keyword
    description: >
      Staging des mots-clés (keywords) du domaine IMDB. Table source vide (0 ligne) sur ce jeu de
      données -- voir imdb_overview.
    columns:
      - name: movie_id
        description: Film associé.
      - name: keyword
        description: Mot-clé associé au film.

  - name: stg_imdb_location
    description: >
      Staging des lieux de tournage (locations) du domaine IMDB. Table source vide (0 ligne) sur
      ce jeu de données -- voir imdb_overview.
    columns:
      - name: movie_id
        description: Film associé.
      - name: location
        description: Lieu de tournage.
      - name: note
        description: Note libre, le cas échéant.

  - name: stg_imdb_release_date
    description: >
      Staging des dates de sortie (release_dates) du domaine IMDB. Table source vide (0 ligne)
      sur ce jeu de données -- voir imdb_overview.
    columns:
      - name: movie_id
        description: Film associé.
      - name: country
        description: Pays de sortie.
      - name: release_date
        description: Date de sortie (format non observable, table vide).
      - name: note
        description: Note libre, le cas échéant.
